
<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עץ או פלי</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #152139;
            color: white;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 40px;
        }

        .coin {
            width: 180px;
            height: 180px;
            background: gold;
            border: 7px solid goldenrod;
            border-radius: 50%;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #5a4000;
            cursor: pointer;
        }

        .spin {
            animation: flip 0.6s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(720deg); }
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #217dbb;
        }

        #result {
            font-size: 30px;
            margin: 25px;
        }
    </style>
</head>

<body>

    <h1>🪙 עץ או פלי?</h1>
    <p>לחץ על המטבע או על הכפתור כדי להגריל!</p>

    <div class="coin" id="coin" onclick="flipCoin()">?</div>

    <h2 id="result">מוכנים להטלה?</h2>

    <button onclick="flipCoin()">הטל מטבע!</button>

    <p id="counter">עץ: 0 | פלי: 0</p>

    <script>
        let treeCount = 0;
        let paliCount = 0;
        let spinning = false;

        function flipCoin() {
            if (spinning) return;

            spinning = true;

            const coin = document.getElementById("coin");
            const result = document.getElementById("result");

            coin.classList.remove("spin");
            void coin.offsetWidth;
            coin.classList.add("spin");

            // הגרלת מספר בין 0 ל-1
            const randomNumber = Math.random();

            setTimeout(function() {
                if (randomNumber < 0.5) {
                    result.textContent = "🌳 יצא עץ!";
                    coin.textContent = "עץ";
                    treeCount++;
                } else {
                    result.textContent = "✨ יצא פלי!";
                    coin.textContent = "פלי";
                    paliCount++;
                }

                document.getElementById("counter").textContent =
                    "עץ: " + treeCount + " | פלי: " + paliCount;

                spinning = false;
            }, 600);
        }
    </script>

</body>
</html>
