<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עץ או פלי</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="עץ או פלי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b1226;
    --bg2: #1b1f4a;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text: #f4f1e8;
    --muted: #a9b0c9;
    --gold-light: #fff1a8;
    --gold: #f5c542;
    --gold-dark: #b8860b;
    --tree: #4ade80;
    --pali: #c084fc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', Arial, sans-serif;
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 15%, rgba(192,132,252,0.18), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(74,222,128,0.12), transparent 40%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff8, transparent),
      radial-gradient(1px 1px at 30% 70%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 55% 30%, #fff9, transparent),
      radial-gradient(1px 1px at 75% 60%, #fff5, transparent),
      radial-gradient(1.5px 1.5px at 90% 15%, #fff8, transparent),
      radial-gradient(1px 1px at 45% 90%, #fff6, transparent);
    pointer-events: none;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .5; } to { opacity: 1; } }

  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 36px 28px 28px;
    text-align: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }

  h1 {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--gold-light), var(--gold), var(--gold-light));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .subtitle { color: var(--muted); margin-top: 6px; font-size: 15px; }

  .stage {
    position: relative;
    height: 260px;
    margin: 18px 0 6px;
    perspective: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .toss { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .toss.flying { animation: toss 1.4s cubic-bezier(.3,0,.3,1); }
  @keyframes toss {
    0%   { transform: translateY(0) scale(1); }
    45%  { transform: translateY(-110px) scale(1.12); }
    100% { transform: translateY(0) scale(1); }
  }

  .coin {
    width: 180px;
    height: 180px;
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(.25,.8,.3,1);
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: radial-gradient(circle at 35% 30%, var(--gold-light) 0%, var(--gold) 45%, var(--gold-dark) 100%);
    box-shadow:
      inset 0 0 0 8px rgba(184,134,11,0.9),
      inset 0 0 0 11px rgba(255,241,168,0.6),
      inset 0 -10px 25px rgba(120,80,0,0.45),
      0 0 40px rgba(245,197,66,0.35);
    color: #5a3e00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .face .icon { font-size: 50px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .face .label { font-size: 30px; font-weight: 900; }
  .face.back { transform: rotateY(180deg); }
  .face.question .label { font-size: 70px; }

  .shadow {
    position: absolute;
    bottom: 22px;
    width: 140px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 70%);
  }
  .shadow.flying { animation: shadow 1.4s cubic-bezier(.3,0,.3,1); }
  @keyframes shadow { 45% { transform: scale(0.45); opacity: .4; } }

  #result {
    font-size: 28px;
    font-weight: 700;
    min-height: 40px;
    margin-bottom: 18px;
  }
  #result.pop { animation: pop .45s ease; }
  @keyframes pop {
    0% { transform: scale(.7); opacity: 0; }
    70% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
  }
  #result.tree { color: var(--tree); }
  #result.pali { color: var(--pali); }

  .flip-btn {
    width: 100%;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    color: #3b2a00;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    border: none;
    padding: 16px;
    border-radius: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 6px 0 var(--gold-dark), 0 12px 30px rgba(245,197,66,0.3);
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  .flip-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-dark), 0 6px 16px rgba(245,197,66,0.3); }
  .flip-btn:disabled { filter: grayscale(.4) brightness(.85); }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 26px;
  }
  .stat {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px;
  }
  .stat .name { font-size: 14px; color: var(--muted); }
  .stat .num { font-size: 34px; font-weight: 900; margin: 2px 0; }
  .stat.tree .num { color: var(--tree); }
  .stat.pali .num { color: var(--pali); }
  .stat .pct { font-size: 13px; color: var(--muted); }

  .bar {
    display: flex;
    height: 10px;
    border-radius: 99px;
    overflow: hidden;
    background: rgba(255,255,255,0.08);
    margin-top: 14px;
  }
  .bar .t { background: var(--tree); width: 50%; transition: width .5s; }
  .bar .p { background: var(--pali); width: 50%; transition: width .5s; }

  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    font-size: 14px;
    color: var(--muted);
  }
  .reset {
    font-family: inherit;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }

  #history {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    min-height: 34px;
    margin-top: 10px;
  }
  .chip {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    animation: pop .35s ease;
  }
  .chip.tree { background: rgba(74,222,128,0.18); border: 1px solid rgba(74,222,128,0.5); }
  .chip.pali { background: rgba(192,132,252,0.18); border: 1px solid rgba(192,132,252,0.5); }
  .empty { color: var(--muted); font-size: 13px; opacity: .7; }

  @media (max-width: 420px) {
    h1 { font-size: 32px; }
    .coin { width: 150px; height: 150px; }
    .face .icon { font-size: 40px; }
    .face .label { font-size: 26px; }
  }
</style>
</head>
<body>

<main class="card">
  <h1>עץ או פלי?</h1>
  <p class="subtitle">לחצו על המטבע או על הכפתור כדי להגריל</p>

  <div class="stage">
    <div class="shadow" id="shadow"></div>
    <div class="toss" id="toss" onclick="flipCoin()">
      <div class="coin" id="coin">
        <div class="face front question" id="front">
          <span class="label">?</span>
        </div>
        <div class="face back">
          <span class="icon">✨</span>
          <span class="label">פלי</span>
        </div>
      </div>
    </div>
  </div>

  <h2 id="result">מוכנים להטלה?</h2>

  <button class="flip-btn" id="flipBtn" onclick="flipCoin()">🪙 הטל מטבע!</button>

  <section class="stats">
    <div class="stat tree">
      <div class="name">🌳 עץ</div>
      <div class="num" id="treeNum">0</div>
      <div class="pct" id="treePct">0%</div>
    </div>
    <div class="stat pali">
      <div class="name">✨ פלי</div>
      <div class="num" id="paliNum">0</div>
      <div class="pct" id="paliPct">0%</div>
    </div>
  </section>

  <div class="bar"><div class="t" id="barT"></div><div class="p" id="barP"></div></div>

  <div class="history-head">
    <span>10 ההטלות האחרונות</span>
    <button class="reset" onclick="resetAll()">איפוס</button>
  </div>
  <div id="history"><span class="empty">עוד לא הוטל מטבע</span></div>
</main>

<script>
  let treeCount = 0;
  let paliCount = 0;
  let spinning = false;
  let rotation = 0;
  let history = [];

  const coin   = document.getElementById("coin");
  const toss   = document.getElementById("toss");
  const shadow = document.getElementById("shadow");
  const front  = document.getElementById("front");
  const result = document.getElementById("result");
  const btn    = document.getElementById("flipBtn");

  function flipCoin() {
    if (spinning) return;
    spinning = true;
    btn.disabled = true;

    if (front.classList.contains("question")) {
      front.classList.remove("question");
      front.innerHTML = '<span class="icon">🌳</span><span class="label">עץ</span>';
    }

    // הגרלת מספר בין 0 ל-1
    const isTree = Math.random() < 0.5;

    // 5 סיבובים ונחיתה על הצד הנכון (עץ = 0°, פלי = 180°)
    const target = isTree ? 0 : 180;
    const current = ((rotation % 360) + 360) % 360;
    const extra = (target - current + 360) % 360;
    rotation += 1800 + extra;
    coin.style.transform = "rotateY(" + rotation + "deg)";

    result.classList.remove("pop", "tree", "pali");
    result.textContent = "...";

    toss.classList.remove("flying");
    shadow.classList.remove("flying");
    void toss.offsetWidth;
    toss.classList.add("flying");
    shadow.classList.add("flying");

    setTimeout(function () {
      if (isTree) {
        result.textContent = "🌳 יצא עץ!";
        result.classList.add("tree");
        treeCount++;
      } else {
        result.textContent = "✨ יצא פלי!";
        result.classList.add("pali");
        paliCount++;
      }
      void result.offsetWidth;
      result.classList.add("pop");

      history.unshift(isTree ? "tree" : "pali");
      history = history.slice(0, 10);

      updateStats();
      spinning = false;
      btn.disabled = false;
    }, 1400);
  }

  function updateStats() {
    const total = treeCount + paliCount;
    const tPct = total ? Math.round(treeCount / total * 100) : 0;
    const pPct = total ? 100 - tPct : 0;

    document.getElementById("treeNum").textContent = treeCount;
    document.getElementById("paliNum").textContent = paliCount;
    document.getElementById("treePct").textContent = tPct + "%";
    document.getElementById("paliPct").textContent = pPct + "%";
    document.getElementById("barT").style.width = (total ? tPct : 50) + "%";
    document.getElementById("barP").style.width = (total ? pPct : 50) + "%";

    const h = document.getElementById("history");
    h.innerHTML = history.length
      ? history.map(x => '<span class="chip ' + x + '">' + (x === "tree" ? "🌳" : "✨") + '</span>').join("")
      : '<span class="empty">עוד לא הוטל מטבע</span>';
  }

  function resetAll() {
    if (spinning) return;
    treeCount = 0;
    paliCount = 0;
    history = [];
    result.classList.remove("tree", "pali");
    result.textContent = "מוכנים להטלה?";
    updateStats();
  }
</script>

</body>
</html>
